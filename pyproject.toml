[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sign-all-historic-notes"
description = "Rich Click CLI scaffold with Sphinx documentation."
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
  "rich-click>=1.8.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "sphinx>=7.0",
]

[project.scripts]
sign-all-historic-notes = "sign_all_historic_notes.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "sign_all_historic_notes.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
